<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Campus Fleet</title>
<meta name="description" content="A 5 to 10 minute decision game about what things really cost over their whole life.">
<style>
:root{
  --bg:#f2ede2; --card:#fbf8f1; --ink:#221e19; --muted:#6a6358; --line:#d8d0bf;
  --accent:#221e19; --accent-ink:#f2ede2; --accent-soft:#e8e1cf;
  --buyer:#2b4a6b; --hidden:#b4532a; --hidden-soft:#f3e0d3; --good:#2f6b3f;
  --serif:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191611; --card:#221e18; --ink:#efe8d8; --muted:#a79f8f; --line:#3a342a;
    --accent:#efe8d8; --accent-ink:#191611; --accent-soft:#2e2819;
    --buyer:#7fa6cf; --hidden:#e08a5c; --hidden-soft:#3a2418; --good:#7fc08f;
  }
}
:root[data-theme="dark"]{
  --bg:#191611; --card:#221e18; --ink:#efe8d8; --muted:#a79f8f; --line:#3a342a;
  --accent:#efe8d8; --accent-ink:#191611; --accent-soft:#2e2819;
  --buyer:#7fa6cf; --hidden:#e08a5c; --hidden-soft:#3a2418; --good:#7fc08f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--serif);min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 20px}
header.top{padding:20px 0 10px;border-bottom:2px solid var(--ink)}
.brand{font-weight:700;font-size:17px;font-style:italic;color:var(--ink)}
.steps{list-style:none;display:flex;gap:14px;margin:8px 0 0;padding:0;font-family:var(--sans)}
.steps li{font-size:13px;color:var(--muted);white-space:nowrap}
.steps li.done{color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
main{flex:1;padding:18px 0 28px;outline:none}
h1{font-size:38px;line-height:1.12;margin:18px 0 14px;font-weight:700;letter-spacing:-.5px}
h2{font-size:30px;line-height:1.15;margin:6px 0 8px;outline:none;font-weight:700;letter-spacing:-.3px}
h3{font-size:19px;margin:0 0 6px}
p{margin:0 0 14px}
.lead{font-size:21px}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin:0 0 14px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font:inherit;font-family:var(--sans);font-size:17px;font-weight:700;padding:14px 20px;border-radius:4px;cursor:pointer;min-height:56px;width:100%}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.inline{width:auto}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:150px}
:focus-visible{outline:3px solid var(--buyer);outline-offset:2px}
h1:focus,h2:focus,main:focus{outline:none}

/* pick cards */
.opts{display:grid;gap:10px;margin:0 0 16px}
.opt{display:block;position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .face{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:4px;padding:16px 16px}
.opt input:checked + .face{border-color:var(--ink);border-left-color:var(--ink);background:var(--accent-soft)}
.opt input:focus-visible + .face{outline:3px solid var(--buyer);outline-offset:2px}
.opt .nm{font-weight:700;font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt .price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt .ds{color:var(--muted);font-size:17px;margin-top:2px;display:block}

/* ledger */
.runtotal{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--ink);padding:10px 0;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.runtotal .lbl{font-size:14px;color:var(--muted);font-family:var(--sans)}
.runtotal .num{font-size:28px;font-weight:700;color:var(--buyer);font-variant-numeric:tabular-nums}
.group{padding:10px 0 12px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.group.new{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.group h3{display:flex;justify-content:space-between;color:var(--buyer);font-size:20px}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:18px}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.event{background:var(--hidden-soft);border-left:4px solid var(--hidden);padding:10px 14px;margin:8px 0 0;font-size:17px;font-style:italic}

.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);margin-left:8px;vertical-align:2px;border:1px solid var(--line);padding:1px 6px;border-radius:3px}
.tag.hid{color:var(--hidden)}

/* hidden cards */
.hcard h3{display:flex;justify-content:space-between;gap:10px}
.hline{padding:12px 0;font-size:18px;border-top:1px solid var(--line)}
.hline .top{display:flex;justify-content:space-between;gap:12px}
.hline b{color:var(--hidden);font-variant-numeric:tabular-nums;white-space:nowrap}
.who{font-size:16px;color:var(--muted);font-style:italic}
.who span{font-weight:700;color:var(--ink);font-style:normal}

/* chart */
.crow{margin:0 0 16px}
.cname{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:19px;margin-bottom:4px}
.cval{font-variant-numeric:tabular-nums}
.bar{display:flex;height:26px;border-radius:2px;overflow:hidden;background:var(--line)}
.seg{height:100%;transition:width .25s ease}
.seg.buyer{background:var(--buyer)}
.seg.hid{background:repeating-linear-gradient(45deg,var(--hidden),var(--hidden) 5px,color-mix(in srgb,var(--hidden) 60%,var(--card)) 5px,color-mix(in srgb,var(--hidden) 60%,var(--card)) 10px)}
.cdet{font-size:16px;color:var(--muted);margin:0 0 6px}
.crow.best .cname{color:var(--good)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin:0 0 12px;font-family:var(--sans)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.buyer{background:var(--buyer)} .sw.hid{background:var(--hidden)}
.ctl{margin:0 0 16px}
.ctl label,.ctl .lab{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin-bottom:8px}
.seg2{display:flex;gap:8px}
.seg2 label{flex:1;position:relative;margin:0;display:block;font-weight:600}
.seg2 input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg2 .face{display:block;text-align:center;border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:4px;padding:16px 8px;font-size:17px;background:var(--card)}
.seg2 input:checked + .face{border-color:var(--ink);background:var(--accent-soft)}
.seg2 input:focus-visible + .face{outline:3px solid var(--buyer);outline-offset:2px}
.verdict{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 18px;font-weight:700;font-size:19px}

textarea{width:100%;font:inherit;font-size:18px;border:1px solid var(--ink);border-radius:4px;padding:10px;background:var(--card);color:var(--ink);resize:vertical;min-height:80px}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin:0 0 12px}
.status{min-height:22px;font-size:14px;color:var(--good);font-weight:700;margin:8px 0 0;font-family:var(--sans)}
footer{padding:14px 0 24px;font-size:13px;color:var(--muted);text-align:center;font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:30px}.steps{gap:8px}.steps li{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">The Campus Fleet</div>
    <ol class="steps" id="steps" hidden></ol>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Made-up numbers, for class. Nothing is saved or sent.</footer>
</div>
<script>
(function(){
'use strict';

var YEARS = 12, EVENT_YEAR = 5;

/* All money is in thousands of dollars for the whole fleet of 10 shuttles. */
var OPTIONS = [
  { id:'diesel', name:'New diesel shuttles', short:'New diesel',
    price:1800, priceNote:'$1.80M', blurb:'Familiar',
    setup:0, setupLabel:'', energy:'fuel', energyLabel:'Fuel', energyPerYear:150, maint:60,
    repairs:[{year:8,label:'Engine overhaul',amt:300}],
    end:{label:'Sold back to a dealer',amt:-150},
    hidden:[
      {l:'Fumes near dorms and classrooms',a:720,who:'Students, staff and neighbors (health)'},
      {l:'Carbon emissions',a:480,who:'Everyone, and future generations'}
    ]},
  { id:'electric', name:'Electric shuttles', short:'Electric',
    price:2600, priceNote:'$2.60M + chargers', blurb:'Plugs in overnight',
    setup:250, setupLabel:'Charging stations installed', energy:'power', energyLabel:'Electricity', energyPerYear:70, maint:30,
    repairs:[{year:9,label:'New battery packs',amt:700,battery:true}],
    end:{label:'Sold back to a dealer',amt:-100},
    hidden:[
      {l:'Mining and making the batteries',a:350,who:'Mining communities far from campus'},
      {l:'Power plant emissions from charging',a:180,who:'Everyone, and future generations'},
      {l:'Old batteries needing safe disposal',a:170,who:'Future campus and the town landfill'}
    ]},
  { id:'used', name:'Used diesel shuttles', short:'Used diesel',
    price:700, priceNote:'$700k', blurb:'3 years old',
    setup:0, setupLabel:'', energy:'fuel', energyLabel:'Fuel', energyPerYear:190, maint:90,
    repairs:[{year:4,label:'Major repairs',amt:300},{year:9,label:'Major repairs',amt:300}],
    end:{label:'Disposal fees',amt:40},
    hidden:[
      {l:'Fumes near dorms and classrooms',a:960,who:'Students, staff and neighbors (health)'},
      {l:'Carbon emissions',a:600,who:'Everyone, and future generations'}
    ]}
];

var EVENTS = [
  {id:'fuel', text:'Fuel prices jump 40% from year 5.', energy:'fuel', mult:1.4},
  {id:'power', text:'Electricity rates jump 40% from year 5.', energy:'power', mult:1.4},
  {id:'calm', text:'A calm decade. Prices hold steady.', energy:null, mult:1}
];

var WEIGHTS=[{v:0,t:'Ignore it',d:'Only what the university pays'},{v:50,t:'Count half',d:'Real, but the estimates are rough'},{v:100,t:'Count all of it',d:'Treat it like a bill'}];
var STEP_NAMES = ['Pick','The bill','Harm','Decide'];
var STAGE_BUTTONS = ['Run it: years 1 to 12','Fix it','Retire it','See my total'];

var app = document.getElementById('app');
var stepsEl = document.getElementById('steps');
var state = fresh();

function fresh(){
  return { screen:'intro', pick:null, stage:0,
    ev:EVENTS[Math.floor(Math.random()*EVENTS.length)],
    weight:0, battery:true, finalPick:null, mind:'', disagree:'' };
}

/* ---------- math ---------- */
function optById(id){ for(var i=0;i<OPTIONS.length;i++){ if(OPTIONS[i].id===id) return OPTIONS[i]; } return null; }
function sum(rows){ var t=0; for(var i=0;i<rows.length;i++) t+=rows[i].a; return t; }
function energyCost(o){
  var t=0;
  for(var y=1;y<=YEARS;y++){
    var m = (state.ev.energy===o.energy && y>=EVENT_YEAR) ? state.ev.mult : 1;
    t += o.energyPerYear*m;
  }
  return Math.round(t);
}
function ledger(o){
  var buy=[{l:'Purchase price (10 shuttles)',a:o.price}];
  if(o.setup) buy.push({l:o.setupLabel,a:o.setup});
  var run=[{l:o.energyLabel+', 12 years',a:energyCost(o)},{l:'Routine maintenance, 12 years',a:o.maint*YEARS}];
  var fix=[];
  o.repairs.forEach(function(r){ if(state.battery || !r.battery) fix.push({l:r.label+' (year '+r.year+')',a:r.amt}); });
  if(!fix.length) fix.push({l:'No major repairs expected',a:0});
  var end=[{l:o.end.label,a:o.end.amt}];
  var groups=[{title:'Buy it',rows:buy},{title:'Run it',rows:run},{title:'Fix it',rows:fix},{title:'Retire it',rows:end}];
  var total=0; groups.forEach(function(g){ g.sub=sum(g.rows); total+=g.sub; });
  return {groups:groups,total:total};
}
function hiddenTotal(o){ return sum(o.hidden); }
function totalAt(o){ return ledger(o).total + Math.round(hiddenTotal(o)*state.weight/100); }
function ranked(fn){ return OPTIONS.slice().sort(function(a,b){ return fn(a)-fn(b); }); }
function fmt(k){
  var neg = k<0, a=Math.abs(k), s;
  if(a>=1000) s='$'+(a/1000).toFixed(2)+'M'; else s='$'+Math.round(a)+'k';
  return neg ? '-'+s : s;
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ---------- shell ---------- */
function setSteps(n){
  if(!n){ stepsEl.hidden=true; return; }
  stepsEl.hidden=false;
  stepsEl.innerHTML = STEP_NAMES.map(function(s,i){
    var c = (i+1<n)?'done':(i+1===n?'now':'');
    return '<li class="'+c+'"'+(i+1===n?' aria-current="step"':'')+'>'+(i+1)+'. '+s+'</li>';
  }).join('');
}
function show(html, stepNo, focusSel){
  app.innerHTML = html;
  setSteps(stepNo);
  var f = app.querySelector(focusSel||'h1,h2');
  if(f){ f.setAttribute('tabindex','-1'); try{ f.focus({preventScroll:true}); }catch(e){} }
  window.scrollTo(0,0);
}
function on(sel, ev, fn){ var el=app.querySelector(sel); if(el) el.addEventListener(ev,fn); }

/* ---------- screens ---------- */
function intro(){
  state.screen='intro';
  show(
    '<h1>Which shuttle do we buy?</h1>'+
    '<p class="lead">The old campus shuttles are done. You have to replace all ten, and whatever you pick has to last twelve years.</p>'+
    '<p class="muted">First you will see what the university pays. Then you will see what it does not.</p>'+
    '<button class="btn" id="go">Start</button>', 0, 'h1');
  on('#go','click',pickScreen);
}

function pickScreen(){
  state.screen='pick';
  var cards = OPTIONS.map(function(o){
    return '<label class="opt"><input type="radio" name="pick" value="'+o.id+'"'+(state.pick===o.id?' checked':'')+'>'+
      '<span class="face"><span class="nm"><span>'+esc(o.name)+'</span><span class="price">'+esc(o.priceNote)+'</span></span>'+
      '<span class="ds">'+esc(o.blurb)+'</span></span></label>';
  }).join('');
  show('<h2>Which will you buy?</h2>'+
    '<p class="muted">Sticker price for all ten. Go with your gut.</p>'+
    '<div class="opts" role="radiogroup" aria-label="Shuttle options">'+cards+'</div>'+
    '<button class="btn" id="buy"'+(state.pick?'':' disabled')+'>Buy it</button>', 1);
  app.querySelectorAll('input[name=pick]').forEach(function(r){
    r.addEventListener('change',function(){ state.pick=r.value; app.querySelector('#buy').disabled=false; });
  });
  on('#buy','click',function(){ if(!state.pick) return; state.stage=1; billScreen(); });
}

function billScreen(){
  state.screen='bill';
  var o=optById(state.pick), L=ledger(o);
  var shown=L.groups.slice(0,state.stage), running=0;
  shown.forEach(function(g){ running+=g.sub; });
  var html='<h2>The bill the university pays</h2>'+
    '<p class="muted">'+esc(o.name)+', over '+YEARS+' years.</p>'+
    '<div class="runtotal" aria-live="polite"><span class="lbl">Running total</span><span class="num">'+fmt(running)+'</span></div>';
  shown.forEach(function(g,i){
    var last = i===shown.length-1;
    html+='<section class="group'+(last?' new':'')+'"><h3><span>'+esc(g.title)+'</span><span>'+fmt(g.sub)+'</span></h3>'+
      g.rows.map(function(r){ return '<div class="line"><span>'+esc(r.l)+'</span><b>'+fmt(r.a)+'</b></div>'; }).join('');
    if(g.title==='Run it'){
      html+='<div class="event"><b>Event:</b> '+esc(state.ev.text)+'</div>';
    }
    html+='</section>';
  });
  if(state.stage<4){
    html+='<button class="btn" id="next">'+STAGE_BUTTONS[state.stage-1+0]+'</button>';
    show(html,2,'h2');
    on('#next','click',function(){ state.stage++; billScreen(); });
    app.querySelector('#next').scrollIntoView({block:'end'});
    return;
  }
  var order=ranked(function(x){return ledger(x).total;});
  html+='<div class="card"><h3>What the university pays</h3><ol class="rank">'+
    order.map(function(x,i){
      return '<li><span>'+(i+1)+'. '+esc(x.name)+(x===o?'<span class="tag">Your pick</span>':'')+'</span><b>'+fmt(ledger(x).total)+'</b></li>';
    }).join('')+'</ol>'+
    '</div>'+
    '<button class="btn" id="hid">Next: what it costs everyone else</button>';
  show(html,2,'h2');
  on('#hid','click',function(){ state.hidIdx=0; hiddenScreen(); });
}

function hiddenScreen(){
  state.screen='hidden';
  var order=[optById(state.pick)].concat(OPTIONS.filter(function(x){return x.id!==state.pick;}));
  var i=state.hidIdx||0, o=order[i], last=i===order.length-1;
  var html='<h2>The bill nobody sends</h2>'+
    '<p class="muted">The university never pays these. Other people do. Rough estimates. ('+(i+1)+' of '+order.length+')</p>'+
    '<section class="card hcard"><h3><span>'+esc(o.name)+(o.id===state.pick?'<span class="tag">Your pick</span>':'')+'</span><span style="color:var(--hidden)">'+fmt(hiddenTotal(o))+'</span></h3>'+
    o.hidden.map(function(r){
      return '<div class="hline"><div class="top"><span>'+esc(r.l)+'</span><b>'+fmt(r.a)+'</b></div>'+
        '<div class="who">Paid by: <span>'+esc(r.who)+'</span></div></div>';
    }).join('')+'</section>'+
    '<button class="btn" id="hn">'+(last?'Decide what counts':'Next option')+'</button>';
  show(html,3,'h2');
  on('#hn','click',function(){ if(last){ state.decStep=0; decideScreen(); } else { state.hidIdx=i+1; hiddenScreen(); } });
}

function legendHtml(){
  return '<div class="legend"><span><i class="sw buyer"></i>University pays</span><span><i class="sw hid"></i>Harm to others, as you count it</span></div>';
}

function decideScreen(){
  state.screen='decide';
  var s=state.decStep||0, html;
  if(s===0){
    html='<h2>Should the harm to others count?</h2>'+
      '<p class="muted">Fumes, mining, waste. No one bills the university for it. Does it count?</p>'+
      '<div class="opts" role="radiogroup" aria-label="How much harm to others counts">'+
      WEIGHTS.map(function(w){
        return '<label class="opt"><input type="radio" name="wt" value="'+w.v+'"'+(state.weight===w.v?' checked':'')+'>'+
          '<span class="face"><span class="nm"><span>'+w.t+'</span></span><span class="ds">'+w.d+'</span></span></label>';
      }).join('')+'</div>'+
      legendHtml()+'<div id="chart"></div><div class="verdict" id="verdict" aria-live="polite"></div>'+
      '<button class="btn" id="n">Next</button>';
    show(html,4,'h2'); paintChart();
    app.querySelectorAll('input[name=wt]').forEach(function(r){
      r.addEventListener('change',function(){ state.weight=+r.value; paintChart(); });
    });
    on('#n','click',function(){ state.decStep=1; decideScreen(); });
  } else if(s===1){
    html='<h2>Will the batteries last?</h2>'+
      '<p class="muted">Electric shuttles only. Nobody knows yet.</p>'+
      '<fieldset class="ctl" style="border:0;padding:0;margin:0 0 16px"><legend class="lab" style="padding:0;width:100%">Battery packs</legend>'+
      '<div class="seg2"><label><input type="radio" name="bat" value="1"'+(state.battery?' checked':'')+'><span class="face">Replace in year 9</span></label>'+
      '<label><input type="radio" name="bat" value="0"'+(state.battery?'':' checked')+'><span class="face">Last all 12 years</span></label></div></fieldset>'+
      legendHtml()+'<div id="chart"></div><div class="verdict" id="verdict" aria-live="polite"></div>'+
      '<button class="btn" id="n">Next</button>';
    show(html,4,'h2'); paintChart();
    app.querySelectorAll('input[name=bat]').forEach(function(r){
      r.addEventListener('change',function(){ state.battery = r.value==='1'; paintChart(); });
    });
    on('#n','click',function(){ state.decStep=2; decideScreen(); });
  } else {
    html='<h2>Your final call</h2>'+
      '<p class="muted">Your first pick was '+esc(optById(state.pick).name)+'.</p>'+
      '<div class="verdict" id="verdict"></div>'+
      '<div class="opts" role="radiogroup" aria-label="Final choice" id="final"></div>'+
      '<button class="btn" id="done"'+(state.finalPick?'':' disabled')+'>Next</button>';
    show(html,4,'h2'); paintChart(); drawFinal();
    on('#done','click',function(){ state.sumStep=0; summaryScreen(); });
  }
}

function drawFinal(){
  var box=app.querySelector('#final'); if(!box) return;
  box.innerHTML = OPTIONS.map(function(o){
    return '<label class="opt"><input type="radio" name="fin" value="'+o.id+'"'+(state.finalPick===o.id?' checked':'')+'>'+
      '<span class="face"><span class="nm"><span>'+esc(o.name)+(o.id===state.pick?'<span class="tag">First pick</span>':'')+'</span></span></span></label>';
  }).join('');
  box.querySelectorAll('input').forEach(function(r){
    r.addEventListener('change',function(){ state.finalPick=r.value; app.querySelector('#done').disabled=false; });
  });
}

function verdictText(){
  var order=ranked(totalAt), best=order[0], gap=totalAt(order[1])-totalAt(best);
  var v='Cheapest overall: '+best.name+', '+fmt(totalAt(best))+'. Next: '+order[1].name+', '+fmt(gap)+' more.';
  if(gap<=Math.round(0.03*totalAt(best))) v+=' Close call.';
  return v;
}

function paintChart(){
  var order=ranked(totalAt), best=order[0], chart=app.querySelector('#chart'), scale=0;
  OPTIONS.forEach(function(o){ scale=Math.max(scale, ledger(o).total+hiddenTotal(o)); });
  if(chart){
    chart.innerHTML = OPTIONS.map(function(o){
      var L=ledger(o).total, H=Math.round(hiddenTotal(o)*state.weight/100), T=L+H;
      var bw=Math.max(0,L)/scale*100, hw=H/scale*100;
      return '<div class="crow'+(o===best?' best':'')+'"><div class="cname"><span>'+esc(o.name)+(o===best?'<span class="tag">Cheapest</span>':'')+'</span>'+
        '<span class="cval">'+fmt(T)+'</span></div>'+
        '<div class="cdet">University pays '+fmt(L)+(state.weight?' + harm to others '+fmt(H):'')+'</div>'+
        '<div class="bar" role="img" aria-label="'+esc(o.name)+': university pays '+fmt(L)+', unbilled counted '+fmt(H)+', total '+fmt(T)+'">'+
        '<span class="seg buyer" style="width:'+bw.toFixed(2)+'%"></span><span class="seg hid" style="width:'+hw.toFixed(2)+'%"></span></div></div>';
    }).join('');
  }
  var v=app.querySelector('#verdict'); if(v) v.textContent=verdictText();
}

function summaryScreen(){
  state.screen='summary';
  var s=state.sumStep||0;
  if(s===0){
    show('<h2>Two quick lines</h2>'+
      '<div class="ctl"><label class="lab" for="mind" style="display:block">What changed your mind, or why not?</label><textarea id="mind" maxlength="400"></textarea></div>'+
      '<div class="ctl"><label class="lab" for="dis" style="display:block">A classmate might disagree because...</label><textarea id="dis" maxlength="400"></textarea></div>'+
      '<button class="btn" id="n">Make my summary</button>',4,'h2');
    app.querySelector('#mind').value=state.mind;
    app.querySelector('#dis').value=state.disagree;
    on('#mind','input',function(e){ state.mind=e.target.value; });
    on('#dis','input',function(e){ state.disagree=e.target.value; });
    on('#n','click',function(){ state.sumStep=1; summaryScreen(); });
  } else {
    show('<h2>Your summary</h2>'+
      '<pre class="out" id="out"></pre>'+
      '<button class="btn" id="copy">Copy summary</button><div class="status" id="status" role="status"></div>'+
      '<div class="row-btns" style="margin-top:10px"><button class="btn ghost" id="retry">Try a different pick, same event</button><button class="btn ghost" id="again">Play again, new event</button></div>',4,'h2');
    app.querySelector('#out').textContent=summaryText();
    on('#copy','click',copySummary);
    on('#retry','click',function(){ state.pick=null; state.finalPick=null; state.stage=0; state.decStep=0; pickScreen(); });
    on('#again','click',function(){ state=fresh(); intro(); });
  }
}

function summaryText(){
  var o=optById(state.pick), f=optById(state.finalPick), order=ranked(totalAt), best=order[0];
  var buyerRank=ranked(function(x){return ledger(x).total;}).indexOf(o)+1;
  var blank=function(s){ s=(s||'').trim(); return s?s:'(not filled in)'; };
  return [
    'THE CAMPUS FLEET: MY RESULT',
    'First pick: '+o.name,
    'What the university pays for it: '+fmt(ledger(o).total)+' over '+YEARS+' years (ranks '+buyerRank+' of 3)',
    'Event in my run: '+state.ev.text,
    'Harm to others counted: '+(state.weight===0?'not at all':state.weight===100?'in full':'half'),
    'Electric battery packs: '+(state.battery?'need replacing in year 9':'last all 12 years'),
    'Cheapest overall at my settings: '+best.name+' ('+fmt(totalAt(best))+')',
    'My final choice: '+f.name+(f===o?' (same as first pick)':' (changed from first pick)'),
    'What changed my mind, or why not: '+blank(state.mind),
    'A classmate might disagree because: '+blank(state.disagree),
    'My own judgment (most sure of, least sure of): '
  ].join('\n');
}

function copySummary(){
  var text=summaryText(), st=app.querySelector('#status');
  function ok(){ st.textContent='Copied.'; }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    var done=false; try{ done=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(done) ok(); else { st.style.color='var(--hidden)'; st.textContent='Copy failed. Select the text above and copy it by hand.'; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok,fallback);
  } else fallback();
}

window.__game = { OPTIONS:OPTIONS, EVENTS:EVENTS, state:function(){return state;}, ledger:ledger, hiddenTotal:hiddenTotal, totalAt:totalAt, ranked:ranked, fmt:fmt, summaryText:summaryText };
intro();
})();
</script>
</body>
</html>
